[project]
name = "yallasell"
version = "0.2.0"
description = "YallaSell – sell once, publish everywhere"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["yallasell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
